# Orchestrates the full stack: Postgres + backend (kbveducation-api) +
# frontend (kbveducation-web). The frontend build context is "../kbveducation-web"
# — this file assumes the two repos are checked out as SIBLING directories
# (i.e. both under the same parent folder), matching how this project has
# been developed. Adjust the path if your layout differs.
#
# Usage (Podman):
#   cp kbveducation-api/.env.example .env   # then fill in JWT_SECRET, ADMIN_PASSWORD
#   podman-compose up --build -d
#
# Usage (Docker):
#   docker compose up --build -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kbv_education}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./kbveducation-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-kbv_education}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see kbveducation-api/.env.example}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kbv.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set for the seeded SUPER_ADMIN}
      STORAGE_BASE_PATH: /data/storage
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - storage_data:/data/storage
      - log_data:/var/log/kbv-education
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8099}:8080"

  frontend:
    build:
      context: ../kbveducation-web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  db_data:
  storage_data:
  log_data:
  caddy_data:
